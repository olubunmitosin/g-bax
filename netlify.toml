[build]
# Build command for static export
command = "npm run build"

# Directory to publish (Next.js static export output)
publish = "out"

# Node.js version
environment = { NODE_VERSION = "18", NPM_FLAGS = "--production=false", NEXT_TELEMETRY_DISABLED = "1" }

# Netlify Functions for backend API
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = [
    "@honeycomb-protocol/hive-control",
    "@honeycomb-protocol/edge-client",
    "@solana/web3.js",
]
included_files = ["backend/**/*"]

# Headers for security and performance
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
for = "/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Redirects for SPA routing
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
conditions = { Role = ["admin"] }

# API redirects to Netlify Functions
[[redirects]]
from = "/api/test"
to = "/.netlify/functions/test"
status = 200

[[redirects]]
from = "/api/users/all"
to = "/.netlify/functions/users-all"
status = 200

[[redirects]]
from = "/api/player-stats/:player"
to = "/.netlify/functions/player-stats?player=:player"
status = 200

[[redirects]]
from = "/api/player-stats"
to = "/.netlify/functions/player-stats"
status = 200

[[redirects]]
from = "/api/profile/:player"
to = "/.netlify/functions/profile?player=:player"
status = 200

[[redirects]]
from = "/api/create-profile"
to = "/.netlify/functions/create-profile"
status = 200

[[redirects]]
from = "/api/update-profile"
to = "/.netlify/functions/update-profile"
status = 200

[[redirects]]
from = "/api/health"
to = "/.netlify/functions/health"
status = 200

# Fallback for client-side routing
[[redirects]]
from = "/*"
to = "/404.html"
status = 404

# Environment variables (these will be set in Netlify dashboard)
# Frontend environment variables:
# NEXT_PUBLIC_SOLANA_NETWORK
# NEXT_PUBLIC_HONEYCOMB_API_KEY

# Backend environment variables (required for Netlify Functions):
# NEXT_PUBLIC_HONEYCOMB_ADMIN_PRIVATE_KEY
# NEXT_PUBLIC_HONEYCOMB_PROJECT_ADDRESS
# NEXT_PUBLIC_HONEYCOMB_PROFILES_TREE_ADDRESS
# NEXT_PUBLIC_HONEYCOMB_RPC_URL
# NEXT_PUBLIC_HONEYCOMB_ENVIRONMENT

# Database environment variables (required for Neon PostgreSQL):
# DATABASE_URL - Neon PostgreSQL connection string
# NODE_ENV - Set to "production" for Netlify deployment
